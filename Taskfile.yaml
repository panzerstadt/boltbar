version: '3'

tasks:
  build:
    desc: Build the native app bundle and launch it
    cmds:
      - sh scripts/build-native.sh
      - open build/Boltbar.app

  test:
    desc: Run the Swift test suite
    cmds:
      - swift test

  run:
    desc: Launch the already-built app
    cmds:
      - open build/Boltbar.app

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf build .build